name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://github.com/ocaml/opam-repository.git
      - run: opam pin add -y -n fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
      - run: opam pin add -y -n exchange-core https://github.com/winterchill-trading/exchange-core.git
      - run: opam pin add -y -n hl-protocol https://github.com/winterchill-trading/hl-protocol.git
      - run: opam pin add -y -n order-book https://github.com/winterchill-trading/order-book.git
      - run: opam pin add -y -n exchange-core-engine https://github.com/winterchill-trading/exchange-core.git
      - run: opam pin add -y -n venue-net https://github.com/winterchill-trading/venue-net.git
      - run: opam pin add -y -n hl-client https://github.com/winterchill-trading/hl-client.git
      - run: opam pin add -y -n hl-sim https://github.com/winterchill-trading/hl-sim.git
      - run: opam pin add -y -n mm-core https://github.com/winterchill-trading/mm-core.git
      - run: opam pin add -y -n hl-mm https://github.com/winterchill-trading/hl-mm.git
      - run: opam pin add -y -n binance-protocol https://github.com/winterchill-trading/binance-protocol.git
      - run: opam pin add -y -n binance-sim https://github.com/winterchill-trading/binance-sim.git
      - run: opam pin add -y -n binance-client https://github.com/winterchill-trading/binance-client.git
      - run: opam pin add -y -n bybit-protocol https://github.com/winterchill-trading/bybit-protocol.git
      - run: opam pin add -y -n bybit-sim https://github.com/winterchill-trading/bybit-sim.git
      - run: opam pin add -y -n bybit-client https://github.com/winterchill-trading/bybit-client.git
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test
